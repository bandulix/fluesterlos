# Prebuilt images from GHCR (no local build).
# Requires packages published by .github/workflows/ghcr.yml (after merge to main).
#
#   cp .env.example .env
#   docker compose -f docker-compose.ghcr.yml up

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluesterlos
      POSTGRES_PASSWORD: fluesterlos
      POSTGRES_DB: fluesterlos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluesterlos -d fluesterlos"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/bandulix/fluesterlos-api:latest
    environment:
      DATABASE_URL: postgres://fluesterlos:fluesterlos@db:5432/fluesterlos
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-change-me-once}
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    image: ghcr.io/bandulix/fluesterlos-web:latest
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
