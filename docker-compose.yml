services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluesterlos
      POSTGRES_PASSWORD: fluesterlos
      POSTGRES_DB: fluesterlos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluesterlos -d fluesterlos"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://fluesterlos:fluesterlos@db:5432/fluesterlos
      HOST_TOKEN: ${HOST_TOKEN:-dev-host-token-change-me}
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: ""
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
