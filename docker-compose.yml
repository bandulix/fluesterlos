services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fluesterlos
      POSTGRES_PASSWORD: fluesterlos
      POSTGRES_DB: fluesterlos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluesterlos -d fluesterlos"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://fluesterlos:fluesterlos@db:5432/fluesterlos
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-change-me-once}
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      DATA_DIR: /data
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NODE_ENV: production
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: ""
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  appdata:
