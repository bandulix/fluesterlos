name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fluesterlos
          POSTGRES_PASSWORD: fluesterlos
          POSTGRES_DB: fluesterlos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fluesterlos -d fluesterlos_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://fluesterlos:fluesterlos@localhost:5432/fluesterlos_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (api + web)
        run: npm run typecheck
      - name: API tests (Postgres)
        run: npm test -w api
      - name: Web tests
        run: npm test -w web
      - name: Build web
        run: npm run build -w web
